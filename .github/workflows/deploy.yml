name: Deploy to edvibe.sungurov.com

on:
  push:
    branches: [main]
  workflow_dispatch: # позволяет запустить вручную из GitHub UI

permissions:
  contents: read

# Не запускать параллельные деплои — каждый новый пуш ждёт завершения предыдущего.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 185.180.230.233
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          key_includes_host: false
          script: |
            set -euo pipefail
            cd /var/www/edvibe.sungurov.com/edvibe-school-mcp
            echo "→ git pull --ff-only origin main"
            git pull --ff-only origin main
            echo "→ npm ci --omit=dev"
            npm ci --omit=dev
            echo "→ chown -R www-data:www-data"
            chown -R www-data:www-data /var/www/edvibe.sungurov.com/edvibe-school-mcp
            echo "→ systemctl restart edvibe-mcp"
            systemctl restart edvibe-mcp
            sleep 1
            echo "→ health check"
            curl -sf http://localhost:9000/healthz && echo "  ok" || { echo "  ✗ health check failed"; exit 1; }
            echo "✓ Deploy complete."
