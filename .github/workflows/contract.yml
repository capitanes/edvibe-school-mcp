name: contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regenerate contract artifacts
        run: |
          npm run build:contract
      - name: Validate contract
        run: npm run validate
      - name: Fail if generated artifacts are stale
        run: |
          if ! git diff --exit-code -- manifest/ openapi/normalized/; then
            echo "::error::Generated artifacts are out of date. Run 'npm run build:contract' and commit the result."
            git diff --stat -- manifest/ openapi/normalized/
            exit 1
          fi
